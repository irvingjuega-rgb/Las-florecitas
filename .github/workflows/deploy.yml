name: Deploy Next.js MejorasMango

on:
  push:
    branches: [ "main" ] 

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install -g pnpm pm2
          npx pnpm install --no-frozen-lockfile
        shell: powershell

      - name: Build Project
        run: npx pnpm run build
        shell: powershell

      - name: Deploy to IIS Folder
        run: |
          $sourcePath = "."
          $destinationPath = "C:\inetpub\wwwroot\Rating de propuestas MC"
          
          # Sincronizamos archivos. XD excluye carpetas, XF excluye archivos.
          robocopy $sourcePath $destinationPath /MIR /V /NP /XD node_modules .git .github /XF .env ecosystem.config.js
          
          if ($lastexitcode -lt 8) { exit 0 } else { exit $lastexitcode }
        shell: powershell

      - name: Restart App with PM2
        run: |
          # 1. IMPORTANTE: Forzamos a que PM2 use la carpeta con los permisos que liberamos
          $env:PM2_HOME = "C:\PM2"
          
          # 2. Entramos a la carpeta del IIS para ejecutar el config
          cd "C:\inetpub\wwwroot\Rating de propuestas MC"

          # 3. Usamos npx para evitar errores de PATH y ecosystem para el puerto y nombre
          try {
              Write-Host "Intentando reiniciar con ecosystem..."
              npx pm2 restart ecosystem.config.js --update-env
          } catch {
              Write-Host "Iniciando por primera vez con ecosystem..."
              npx pm2 start ecosystem.config.js
          }
          
          # 4. Guardamos el estado para el Servicio de Red
          npx pm2 save
        shell: powershell
