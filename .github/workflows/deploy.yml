name: Deploy Next.js MejorasMango

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install -g pnpm pm2
          npx pnpm install --no-frozen-lockfile
        shell: powershell

      - name: Build Project
        run: npx pnpm run build
        shell: powershell

      - name: Deploy to IIS Folder
        run: |
          $sourcePath = "."
          $destinationPath = "C:\inetpub\wwwroot\Rating de propuestas MC"
          
          # Mantenemos protegidos tus archivos locales del server
          robocopy $sourcePath $destinationPath /MIR /V /NP /XD node_modules .git .github /XF .env .env.local web.config
          
          if ($lastexitcode -lt 8) { exit 0 } else { exit $lastexitcode }
        shell: powershell

      - name: Restart App with PM2
        run: |
          # 1. Definimos la casa de PM2
          $env:PM2_HOME = "C:\PM2"

          # 2. LIMPIEZA DE PROCESOS: Matamos a Node para liberar el socket (rpc.sock)
          # El '2>$null' es para que no marque error si no hay nada que matar
          taskkill /F /IM node.exe /T 2>$null
          
          # Esperamos 2 segundos a que Windows suelte los archivos
          Start-Sleep -s 2

          # 3. Entramos a la carpeta y levantamos con el config
          cd "C:\inetpub\wwwroot\Rating de propuestas MC"
          
          # Intentamos borrar la instancia vieja (si existe) y lanzamos la nueva
          npx pm2 delete "mejoras-calidad" 2>$null
          npx pm2 start ecosystem.config.js
          
          # 4. Guardamos para que el Servicio de Red lo recuerde siempre
          npx pm2 save
        shell: powershell
